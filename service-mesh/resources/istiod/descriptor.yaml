apiVersion: gitups/v1alpha1
kind: PackageDescriptor
metadata:
  name: istiod
spec:
  renderer: helm
  inputs:
    - name: namespace
      type: string
      default: istio-system
    - name: chart.version
      type: string
      default: 1.29.2
    - name: appVersion
      type: string
      default: 1.29.2
    - name: replicaCount
      type: int
      default: 1
  dependsOn:
    - service-mesh/install
  helm:
    repo: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    version: 1.29.2
    valuesTemplate: values.yaml.tmpl
