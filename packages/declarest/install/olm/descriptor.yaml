apiVersion: gitups/v1alpha1
kind: PackageDescriptor
metadata:
  name: olm
spec:
  renderer: olm
  inputs:
    - name: namespace
      type: string
      default: declarest-system
    - name: olm.startingCSV
      type: string
      default: declarest-operator.v0.4.0
  dependsOn:
    - olm/install
  olm:
    package: declarest-operator
    channel: stable
    source: operatorhubio-catalog
    sourceNamespace: olm
    startingCSV: declarest-operator.v0.4.0
    installPlanApproval: Automatic
    operatorGroupScope: AllNamespaces
