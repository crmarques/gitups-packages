apiVersion: gitups/v1alpha1
kind: PackageDescriptor
metadata:
  name: config
spec:
  renderer: raw
  inputs:
    - name: namespace
      type: string
      default: declarest-system
    - name: repoURL
      type: string
      placeholder: true
      placeholderReason: "GitOps repository URL Declarest will watch in the e2e flow"
    - name: targetRevision
      type: string
      default: HEAD
  dependsOn:
    - declarest/install
