apiVersion: gitups/v1alpha1
kind: PackageDefinition
metadata:
  name: declarest
  version: 0.2.0
spec:
  role: service-resource-controller
  category: gitops-controller
  # Both `raw` (in-tree manifest bundle pinned to ghcr.io/crmarques/declarest)
  # and `olm` (declarest-operator via operatorhubio-catalog) install methods
  # are available. Keep `raw` as the default until the OLM catalog entry is
  # verified for the target environment; Provisions opt into OLM explicitly
  # with `installMethod: olm`.
  defaultInstall: raw
  defaultResources: []
  cli:
    binary: declarest
    # Default (CLI-only) invocation template used by gitups when a
    # resource unit has `Controller.Intent == "managed-script"`.
    # `{{.Context}}` here is a **declarest context** (the named
    # {repo, managed-service, secret-store} triple declared via
    # `declarest context use`), **not** a kubectl context. Gitups
    # currently populates it from CLIContext.Namespace as a
    # placeholder convention; a cleaner wiring is deferred until the
    # managed-script domain unit is rewritten against declarest CLI
    # v0.3.x (`declarest resource apply /path`).
    args:
      - resource
      - apply
      - --context={{.Namespace}}
      - "{{.ManifestPath}}"
    # spec.cli.intents intentionally empty. Bootstrap-sync intents
    # (previously `sync-policy`) needed `--sync-policy=<manifest>`
    # which declarest CLI v0.3.x dropped in favour of a
    # context/repository model. Re-enable once the
    # declarest-metadata-bundles repo ships the per-service contexts
    # that drive the new flow. Without an intent here, gitups
    # kubectl-applies SyncPolicy CRs and waits for the in-cluster
    # declarest operator to reconcile them at steady state.
    intents: {}
  readiness:
    - kind: Deployment
      namespace: declarest
      name: declarest
      condition: Available
  compatibility:
    kubernetes:
      - ">=1.28"
