apiVersion: gitups/v1alpha1
kind: PackageDefinition
metadata:
  name: another-example
  version: 0.1.0
  description: Example package demonstrating spec.package include/exclude overrides.
spec:
  role: workload
  category: example
  defaultInstall: raw
  # Packaging overrides:
  #  * includeTests: true ships the tests/ directory in the release tarball
  #    so downstreams can run the same smoke tests against the pinned
  #    artifact. The default is false.
  #  * exclude drops any .disabled overlay from the tarball even when the
  #    default include list would otherwise pick them up.
  package:
    includeTests: true
    exclude:
      - "install/raw/raw/*.disabled"
