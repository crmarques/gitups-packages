apiVersion: gitups/v1alpha1
kind: PackageDefinition
metadata:
  name: metallb
  version: 0.0.1
spec:
  role: workload
  category: network-lb
  defaultInstall: olm
  defaultResources:
    - template: config
      name: default
  provides:
    - capability: lb-ip-pool
      resourceTemplate: pool
      exports:
        - name: poolName
          from: binding:poolName
        - name: cidrs
          from: binding:cidrs
