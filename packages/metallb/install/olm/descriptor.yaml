apiVersion: gitups/v1alpha1
kind: PackageDescriptor
metadata:
  name: olm
spec:
  renderer: olm
  inputs:
    - name: namespace
      type: string
      default: metallb-system
    - name: olm.startingCSV
      type: string
      default: metallb-operator.v0.14.0
  dependsOn:
    - olm/install
  olm:
    package: metallb-operator
    channel: beta
    source: operatorhubio-catalog
    sourceNamespace: olm
    startingCSV: metallb-operator.v0.14.0
    installPlanApproval: Automatic
    operatorGroupScope: AllNamespaces
