apiVersion: gitups/v1alpha1
kind: PackageDescriptor
metadata:
  name: helm
spec:
  renderer: helm
  inputs:
    - name: namespace
      type: string
      default: metallb-system
    - name: chart.version
      type: string
      default: 0.15.3
    - name: appVersion
      type: string
      default: v0.15.3
  helm:
    repo: https://metallb.github.io/metallb
    chart: metallb
    version: 0.15.3
    valuesTemplate: values.yaml.tmpl
