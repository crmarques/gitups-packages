apiVersion: gitups/v1alpha1
kind: PackageDescriptor
metadata:
  name: config
spec:
  renderer: raw
  inputs:
    - name: namespace
      type: string
      default: gitea
    - name: rootURL
      type: string
      default: http://gitea.gitea.svc.cluster.local:3000/
  dependsOn:
    - gitea/install
