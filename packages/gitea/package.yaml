apiVersion: gitups/v1alpha1
kind: PackageDefinition
metadata:
  name: gitea
  version: 0.0.1
spec:
  role: workload
  category: source-control
  defaultInstall: helm
  defaultResources:
    - template: config
      name: default
  # Gitea exposes its Admin API (orgs/repos/users/permissions) to
  # declarest via the `gitea` metadata bundle (published at
  # github.com/crmarques/declarest-metadata-bundles/bundles/gitea).
  # Gitups never fetches the bundle — declarest resolves it at
  # runtime when a ManagedService's spec.metadata.bundle points here.
  declarestBundle:
    name: gitea
    version: 0.0.1
    ref: ghcr.io/crmarques/declarest-metadata-bundles/gitea:0.0.1
  readiness:
    - kind: Deployment
      namespace: gitea
      name: gitea
      condition: Available
  provides:
    - capability: git-provider
      resourceTemplate: user
      exports:
        - name: url
          from: input:rootURL
        - name: username
          from: binding:username
        - name: token
          from: placeholder
          secret: true
