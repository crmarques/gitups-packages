apiVersion: gitups/v1alpha1
kind: PackageDescriptor
metadata:
  name: backend
spec:
  renderer: raw
  # http-proxy/v1alpha1 backend CR. The SRC (Declarest) reconciles
  # these into actual haproxy frontend/backend stanzas and reloads
  # the data-plane. Gitups renders the CR body deterministically;
  # runtime translation is outside gitups's concern.
  inputs:
    - name: serviceName
      type: string
      required: true
      placeholderReason: "Kubernetes Service name to route traffic to"
    - name: serviceNamespace
      type: string
      required: true
      placeholderReason: "Namespace of the target Kubernetes Service"
    - name: servicePort
      type: int
      required: true
      placeholderReason: "Service port (integer) exposed by the backend"
    - name: host
      type: string
      required: true
      placeholderReason: "HTTP Host header to match on the frontend (e.g. gitea.example.com)"
    - name: path
      type: string
      default: "/"
    - name: tls.enabled
      type: bool
      default: false
    - name: tls.secretName
      type: string
      default: ""
  dependsOn:
    - haproxy/install
