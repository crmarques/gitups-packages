apiVersion: gitups/v1alpha1
kind: PackageDefinition
metadata:
  name: haproxy
  version: 0.2.0
spec:
  role: workload
  category: ingress
  defaultInstall: helm
  defaultResources: []
  # haproxy exposes a Data Plane API that declarest can reconcile via
  # the `haproxy-dataplane-bundle` metadata bundle. Gitups does not
  # fetch the bundle — it is resolved at runtime by declarest when the
  # ManagedService's spec.metadata.bundle points here.
  declarestBundle:
    name: haproxy-dataplane-bundle
    version: 0.1.0
    ref: ghcr.io/crmarques/declarest-bundles/haproxy-dataplane-bundle:0.1.0
  compatibility:
    kubernetes:
      - ">=1.28"
