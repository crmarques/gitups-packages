apiVersion: gitups/v1alpha1
kind: PackageDefinition
metadata:
  name: haproxy
  version: 0.2.0
spec:
  role: workload
  category: ingress
  defaultInstall: helm
  defaultResources: []
  # haproxy exposes a Data Plane API that declarest can reconcile via
  # the `haproxy` metadata bundle (published at
  # github.com/crmarques/declarest-metadata-bundles/bundles/haproxy).
  # Gitups never fetches the bundle — declarest resolves it at
  # runtime when a ManagedService's spec.metadata.bundle points here.
  declarestBundle:
    name: haproxy
    version: 0.0.1
    ref: ghcr.io/crmarques/declarest-metadata-bundles/haproxy:0.0.1
  compatibility:
    kubernetes:
      - ">=1.28"
