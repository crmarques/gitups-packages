apiVersion: gitups/v1alpha1
kind: PackageDescriptor
metadata:
  name: repo-secret
spec:
  renderer: raw
  inputs:
    - name: namespace
      type: string
      default: argocd
    - name: repoURL
      type: string
      required: true
    - name: repoUsername
      type: string
      required: true
    - name: repoPassword
      type: string
      required: true
      sensitive: true
  dependsOn:
    - argocd/install
  readiness:
    - kind: Deployment
      namespace: '{{ .Values.namespace }}'
      name: argocd-server
      condition: Available
